# NOTE: This file is a documentation-only template. ODSX does NOT load it.
# The active security.properties consumed at runtime ships inside the
# GigaSpaces zip at gigaspaces-smart-ods/config/security/security.properties
# and is sed-edited at install time by scripts/security_manager_install.sh
# and scripts/security_space_install.sh, which substitute $gigapath
# (read from app.giga.path in app.config) into the file before deploying it
# to /<app.giga.path>/gs_config/security.properties on each manager/space host.
#
# Kept in the repo as a reference for the file format and the required keys.
com.gs.security.security-manager.class=com.gigaspaces.security.spring.SpringSecurityManager
spring-security-config-location=//${app.giga.path}/gs_config/ldap-security-config.xml
